# roles/system_update/tasks/main.yml
- name: Update APT package index
  apt:
    update_cache: yes
    cache_valid_time: 3600  # Optional: cache valid for 1 hour to avoid repeated updates
  become: true

- name: Upgrade all APT packages
  apt:
    upgrade: dist
    autoremove: yes
    autoclean: yes
  become: true