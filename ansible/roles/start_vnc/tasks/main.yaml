- name: Install required packages for VNC over PipeWire
  ansible.builtin.package:
    name:
      - gnome-remote-desktop
      - libsecret-tools
    state: present
  become: true
  tags: start_vnc  

- name: Set VNC authentication method to 'password'
  ansible.builtin.command:
    cmd: gsettings set org.gnome.desktop.remote-desktop.vnc auth-method 'password'
  become_user: "jesse"
  changed_when: false
  tags: start_vnc  

- name: Set VNC view-only to false
  ansible.builtin.command:
    cmd: gsettings set org.gnome.desktop.remote-desktop.vnc view-only false
  become_user: "jesse"
  changed_when: false
  tags: start_vnc

# TODO maybe you need this for the user not for root, or maybe we need to replace this entirely
- name: Store VNC password in secret-tool
  ansible.builtin.command:
    cmd: "echo -n '{{ vnc_password }}' | secret-tool store --label='GNOME Remote Desktop VNC password' 'xdg:schema' 'org.gnome.RemoteDesktop.VncPassword'"
  args:
    creates: "{{ ansible_env.HOME }}/.local/share/keyrings"
  become_user: "jesse"
  no_log: false
  tags: start_vnc

- name: Allow VNC traffic
  ansible.builtin.iptables:
    chain: INPUT
    protocol: tcp
    destination_port: '5900'
    jump: ACCEPT
  become: true
  tags: start_vnc

- name: Allow VNC traffic
  ansible.builtin.iptables:
    chain: INPUT
    protocol: tcp
    destination_port: '5902'
    jump: ACCEPT
  become: true
  tags: ip_table

- name: Ensure TLS certificate directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "/etc/ssl/certs"
    - "/etc/ssl/private"
  become: true
  tags: start_vnc 

- name: Generate RDP TLS certificate and key
  ansible.builtin.openssl_privatekey:
    path: "/etc/ssl/private/rdp_key.pem"
    size: 4096
  become: true
  tags: start_vnc 

- name: Generate RDP TLS self-signed certificate
  ansible.builtin.openssl_certificate:
    path: "/etc/ssl/certs/rdp_cert.pem"
    privatekey_path: "/etc/ssl/private/rdp_key.pem"
    provider: selfsigned
  become: true
  tags: start_vnc 

- name: Set RDP TLS certificate path
  ansible.builtin.command:
    cmd: "gsettings set org.gnome.desktop.remote-desktop.rdp tls-cert '/etc/ssl/certs/rdp_cert.pem'"
  become_user: "jesse"
  tags: start_vnc 

- name: Set RDP TLS key path
  ansible.builtin.command:
    cmd: "gsettings set org.gnome.desktop.remote-desktop.rdp tls-key '/etc/ssl/private/rdp_key.pem'"
  become_user: "jesse"
  tags: start_vnc 

- name: Restart gnome-remote-desktop service for user
  ansible.builtin.command:
    cmd: "systemctl --user restart gnome-remote-desktop"
  become: true
  become_user: "jesse"
  tags: start_vnc 

- name: Get IP address
  ansible.builtin.shell: hostname -I | awk '{print $1}'
  register: ip_address
  changed_when: false
  tags: start_vnc

- name: Display IP In Log
  ansible.builtin.debug:
    var: ip_address.stdout
  tags: start_vnc


  ################## STOP
- name: Uninstall VNC packages
  ansible.builtin.package:
    name:
      - gnome-remote-desktop
      - libsecret-tools
    state: absent
  become: true
  tags: stop_vnc

