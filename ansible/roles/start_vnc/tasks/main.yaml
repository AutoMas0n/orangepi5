- name: Remove VNC traffic rule for port 5900
  ansible.builtin.iptables:
    chain: INPUT
    protocol: tcp
    destination_port: '5900'
    jump: ACCEPT
    state: absent
  become: true
  tags: stop_vnc

- name: Remove VNC traffic rule for port 5902
  ansible.builtin.iptables:
    chain: INPUT
    protocol: tcp
    destination_port: '5902'
    jump: ACCEPT
    state: absent
  become: true
  tags: stop_vnc

