- name: Delete RDP TLS certificate and key
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "/etc/ssl/certs/rdp_cert.pem"
    - "/etc/ssl/private/rdp_key.pem"
  become: true
  tags: stop_vnc

