- name: Enable screen sharing
  ansible.builtin.command:
    cmd: gsettings set org.gnome.desktop.remote-desktop.vnc enable true
  become: true
  become_user: "{{ ansible_user_id }}"
  notify: Print IP address

- name: Get IP address
  ansible.builtin.shell: hostname -I | awk '{print $1}'
  register: ip_address